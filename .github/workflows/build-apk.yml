name: Build Dongflix APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Cache Dongflix Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: app/dongflix.jks
          key: dongflix-signing-keystore-v1

      - name: Auto-Generate Keystore (First Time Only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore app/dongflix.jks -storepass dongflix123 -alias dongflix -keypass dongflix123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dongflix, OU=Dev, O=Rulsz, L=ID, S=ID, C=ID"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build_output.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dongflix-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Kirim ZIP ke Telegram (Sukses)
        if: success()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}"
          zip -j Dongflix-Build.zip app/build/outputs/apk/debug/app-debug.apk
          curl -F document=@"Dongflix-Build.zip" \
               -F caption="Build Dongflix berhasil! (Commit: ${COMMIT_MSG})" \
               "https://api.telegram.org/bot9240189258:AAE8k0uNjJ6QsS_uOga0JEVALb79Taax6yQ/sendDocument?chat_id=1163053213"

      - name: Kirim Log Error ke Telegram (Gagal)
        if: failure()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}"
          if [ -f build_output.log ]; then
            ERR_SNIPPET=$(grep -E "error:|FAILURE:|Exception:|Execution failed" build_output.log | tail -n 25)
            if [ -z "$ERR_SNIPPET" ]; then
              ERR_SNIPPET=$(tail -n 25 build_output.log)
            fi
          else
            ERR_SNIPPET="Build gagal sebelum langkah gradle assembleDebug dijalankan."
          fi

          ERR_ESCAPED=$(printf '%s' "$ERR_SNIPPET" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | cut -c 1-3200)

          curl -s -X POST "https://api.telegram.org/bot9240189258:AAE8k0uNjJ6QsS_uOga0JEVALb79Taax6yQ/sendMessage" \
               --data-urlencode "chat_id=1163053213" \
               --data-urlencode "parse_mode=HTML" \
               --data-urlencode "text=❌ <b>Build Dongflix Gagal!</b>
<b>Commit:</b> ${COMMIT_MSG}

<pre>${ERR_ESCAPED}</pre>"
