name: Build Dongflix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Simpan & ambil otomatis keystore yang sama untuk setiap build
      - name: Cache Dongflix Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: app/dongflix.jks
          key: dongflix-signing-keystore-v1

      # Hanya berjalan 1x saat build pertama kali (jika file belum ada di cache)
      - name: Auto-Generate Keystore (First Time Only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore app/dongflix.jks -storepass dongflix123 -alias dongflix -keypass dongflix123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dongflix, OU=Dev, O=Rulsz, L=ID, S=ID, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dongflix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
